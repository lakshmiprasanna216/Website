<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to Step Notes, a dance journal.">
  <title>Log in | Step Notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body class="login-page">
  <header class="login-header">
    <a class="wordmark" href="index.html" aria-label="Step Notes home"><span class="wordmark-icon">S</span> step notes<span class="wordmark-period">.</span></a>
    <a class="login-header-link" href="index.html">← Back to the journal</a>
  </header>

  <main class="login-main">
    <section class="login-photo" aria-label="Dance studio">
      <div class="login-photo-copy">
        <p>My Dance Blog</p>
        <h1>Welcome back!</h1>
      </div>
    </section>

    <section class="login-form-panel" aria-labelledby="login-title">
      <p class="eyebrow">Member area</p>
      <h2 id="login-title">Log In</h2>
      <p class="login-description">Enter your email and password.</p>

      <form class="login-form">
        <label class="login-field" for="login-email">
          Email address
          <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label class="login-field" for="login-password">
          Password
          <span class="password-wrap">
            <input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Show</button>
          </span>
        </label>

        <label class="remember-option" for="remember-me">
          <input id="remember-me" name="remember" type="checkbox">
          Remember me
        </label>

        <button class="login-submit" type="submit">Log in</button>
        <p class="login-message" aria-live="polite"></p>
      </form>
      <p class="signup-prompt">Don’t have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <footer class="login-footer">A little more rhythm, every day.</footer>
</body>
</html>
